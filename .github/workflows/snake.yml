on:
  schedule:
    # 日本時間の毎朝 10:00
    - cron: '0 1 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#0ABAB5&color_dots=#161B22,#263444,#455D77,#62809C,#94B1C9

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: snake-output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
